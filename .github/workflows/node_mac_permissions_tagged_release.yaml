name: node-mac-permissions Create tagged release
on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

defaults:
  run:
    working-directory: ./node-mac-permissions

jobs:
  test:
    runs-on: macos-11
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v3
      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install
        run: npm install
      - name: Build
        run: npm run build:release
      - name: Run tests
        run: npm test

  deploy:
    needs:
      - test
    runs-on: macos-11
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v3
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install
      - name: Publish tagged release to npm
        run: |
          ./.build/pre-publish.sh
          npm run publish:next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
