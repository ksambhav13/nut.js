name: Libnut Core Create tagged release
on:
  workflow_dispatch:
  push:
    branches:
      - publish-libnut-ksambhav13

defaults:
  run:
    working-directory: ./libnut-core

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ 18 ]
    runs-on: ${{matrix.os}}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4.1.1
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
          registry-url: 'https://registry.npmjs.org'
      - name: Configure Linux environment
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y cmake libx11-dev zlib1g-dev libpng-dev libxtst-dev build-essential
      - name: Install
        run: npm run patch && npm i
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_strict_ssl: "false"
          TARGET_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'darwin' || 'win32' }}
      - name: Publish tagged release to npm
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "${NPMRC}"
          npm run publish:next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          npm_config_registry: https://registry.npmjs.org/
          npm_config_strict_ssl: "false"
