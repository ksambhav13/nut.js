name: Libnut Core Create tagged release
on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

defaults:
  run:
    working-directory: ./libnut-core

jobs:
  deploy:
    strategy:
      matrix:
        os: [ ubuntu-20.04, macos-11, windows-2019 ]
        node: [ 18 ]
    runs-on: ${{matrix.os}}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4.1.1
      - name: Set up node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{matrix.node}}
      - name: Configure Linux environment
        if: ${{matrix.os == 'ubuntu-20.04'}}
        run: sudo apt-get install -y cmake libx11-dev zlib1g-dev libpng-dev libxtst-dev build-essential
      - name: Install
        run: npm run patch && npm i
      - name: Publish tagged release to npm
        run: npm run publish:next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
